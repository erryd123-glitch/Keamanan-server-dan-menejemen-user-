function addQ(rows,src){

 const s=q[eq],n=q.length;
 return `<h2>Evaluasi / Ujian</h2><div class="row mut"><span>Soal ${eq+1} dari ${n}</span><span>Terjawab ${Object.keys(ea).length}/${n}</span></div><div class="bar" style="margin:8px 0 16px"><i style="width:${(eq+1)/n*100}%"></i></div>
 <div class="card"><div style="font-size:19px;font-weight:600;margin-bottom:10px">${esc(s.pertanyaan)}</div>${['a','b','c','d','e'].map(o=>{const O=o.toUpperCase();return `<div class="opt ${ea[s.id]===O?'sel':''}" onclick="ea[${s.id}]='${O}';render()">${O}. ${esc(s[o])}</div>`}).join('')}</div>
 <div class="row"><button class="btn o" ${eq?'':'disabled'} onclick="eq--;render()">‹ Sebelumnya</button>${eq<n-1?`<button class="btn" onclick="eq++;render()">Berikutnya ›</button>`:`<button class="btn" style="background:var(--ok)" onclick="submitEv()">Kirim Jawaban</button>`}</div>
 <div class="card" style="margin-top:12px"><span class="mut">Navigasi soal</span><br>${q.map((z,i)=>`<button class="btn s ${i===eq?'':'o'}" style="margin:3px;${ea[z.id]&&i!==eq?'border-color:var(--ok)':''}" onclick="eq=${i};render()">${i+1}</button>`).join('')}</div>`}
function submitEv(){
 const q=G('soal')||[];if(!q.length){alert('Belum ada soal evaluasi. Silakan hubungi guru.');return}
 let b=0,terjawab=0;const ans={};
 q.forEach(s=>{ans[s.id]=ea[s.id]||'';if(ans[s.id])terjawab++;if(ans[s.id]===s.kunci)b++});
 const nilai=Math.round(b/q.length*100),h=G('hasil')||[],id=Date.now();
 const hasilBaru={id,user_id:me.id,nilai,benar:b,total:q.length,terjawab,kosong:q.length-terjawab,salah:terjawab-b,jawaban:ans,tanggal:new Date().toLocaleDateString('id-ID')};
 h.push(hasilBaru);S('hasil',h);selH=id;page='sert';nav();
}
function nilai(){const g=me.role==='guru',us=G('users'),h=g?G('hasil'):myHasil();
 return `<h2>Hasil Nilai</h2>${g&&h.length?`<div class="card"><button class="btn r" onclick="hapusSemuaHasil()">Hapus Semua Hasil Nilai</button><p class="mut">Guru dapat menghapus satu hasil atau seluruh riwayat nilai. Tindakan ini tidak dapat dibatalkan.</p></div>`:''}<div class="card sc"><table><tr>${g?'<th>Murid</th>':''}<th>Tanggal</th><th>Benar</th><th>Nilai</th><th>Predikat</th>${g?'<th>Aksi</th>':''}</tr>${h.map(x=>`<tr>${g?`<td>${esc((us.find(u=>u.id===x.user_id)||{}).nama)}</td>`:''}<td>${x.tanggal}</td><td>${x.benar}/${x.total}</td><td><b>${x.nilai}</b></td><td>${pred(x.nilai)}</td>${g?`<td><button class="btn r s" onclick="hapusHasil(${x.id})">Hapus</button></td>`:''}</tr>`).join('')||'<tr><td colspan="6">Belum ada hasil</td></tr>'}</table></div>`}
function hapusHasil(id){if(me.role!=='guru')return;if(!confirm('Hapus hasil nilai ini? Tindakan tidak dapat dibatalkan.'))return;S('hasil',G('hasil').filter(x=>Number(x.id)!==Number(id)));if(Number(selH)===Number(id))selH=0;render()}
function hapusSemuaHasil(){if(me.role!=='guru')return;if(!confirm('Yakin ingin menghapus SEMUA hasil nilai seluruh siswa? Tindakan tidak dapat dibatalkan.'))return;S('hasil',[]);selH=0;render()}
let selH=0;
function sert(){const us=G('users'),all=(me.role==='guru'?G('hasil'):myHasil()).slice().sort((a,b)=>a.id-b.id);
 if(!all.length)return '<h2>Sertifikat</h2><div class="card">Belum ada hasil evaluasi. Murid harus mengerjakan menu Evaluasi dulu.</div>';
 const x=all.find(a=>a.id===selH)||all[all.length-1],u=us.find(a=>a.id===x.user_id)||{nama:'-'},lulus=x.nilai>=70;
 const terjawab=Number.isFinite(x.terjawab)?x.terjawab:Object.values(x.jawaban||{}).filter(Boolean).length;
 const kosong=Number.isFinite(x.kosong)?x.kosong:Math.max(0,x.total-terjawab);
 const salah=Number.isFinite(x.salah)?x.salah:Math.max(0,terjawab-x.benar);
 const sel=`<div class="card noprint"><b>${me.role==='guru'?'Pilih murid / hasil':'Riwayat evaluasi saya'}</b><select onchange="selH=Number(this.value);render()">${all.map(a=>`<option value="${a.id}" ${a.id===x.id?'selected':''}>${esc((us.find(k=>k.id===a.user_id)||{}).nama)} — nilai ${a.nilai} (${a.tanggal})</option>`).join('')}</select></div>`;
 return `<h2 class="noprint">Hasil Evaluasi & Sertifikat</h2>${sel}
 <div class="grid noprint"><div class="card stat"><small>Nilai</small><b>${x.nilai}/100</b><small>${pred(x.nilai)}</small></div><div class="card stat"><small>Jawaban benar</small><b>${x.benar}</b><small>dari ${x.total} soal</small></div><div class="card stat"><small>Jawaban salah</small><b>${salah}</b><small>Jawaban terisi: ${terjawab}</small></div><div class="card stat"><small>Belum dijawab</small><b>${kosong}</b><small>Total soal: ${x.total}</small></div></div>
 <div class="cert"><p style="letter-spacing:.18em;font-size:12px">SECURE LMS · KEAMANAN SERVER</p><h1>SERTIFIKAT</h1><h2>HASIL EVALUASI</h2><p>Diberikan kepada</p><h2>${esc(u.nama)}</h2><p>Telah menyelesaikan evaluasi pembelajaran pada</p><p><b>Keamanan Server dan Manajemen User</b></p><div class="big">${x.nilai}/100</div><p><b>Jumlah soal:</b> ${x.total} &nbsp; · &nbsp; <b>Benar:</b> ${x.benar} &nbsp; · &nbsp; <b>Salah:</b> ${salah}</p><p><b>Terjawab:</b> ${terjawab} &nbsp; · &nbsp; <b>Kosong:</b> ${kosong}</p><p><b>STATUS: ${lulus?'TUNTAS':'BELUM TUNTAS (nilai minimum 70)'}</b></p><p>${esc(x.tanggal)} · No. LMS-${String(x.id).slice(-8)}</p><div class="sign-area"><p>Klaten, ${esc(x.tanggal)}<br>Guru Mata Pelajaran</p><div class="sign-line"></div><b class="sign-name">Dina Nurfitasari</b></div></div>
 <p class="noprint" style="text-align:center"><button class="btn" onclick="print()">🖨 Cetak / Simpan PDF</button> <button class="btn o" onclick="go('eval')">Kembali ke Evaluasi</button></p>`}

function akun(){return `<h2>Keamanan Akun</h2><div class="card"><p class="mut">Login: <b>${esc(me.username)}</b></p><label>Password baru</label><input id="np" type="password"><button class="btn" onclick="chPw()">Simpan Password</button><p id="pm" class="mut"></p></div>`}
function chPw(){const v=$('np').value;if(v.length<3){$('pm').textContent='Minimal 3 karakter';return}const u=G('users');u.find(x=>x.id===me.id).password=v;S('users',u);$('pm').textContent='Password diganti ✔'}
const PD=[['Pekan 1','Flashdisk bergantian',45],['Pekan 2','Kirim lewat chat grup',30],['Pekan 3','Hardening Server',14],['Pekan 4','Manajemen User',9],['Pekan 5','Audit Keamanan',8]];
const PQ=[
{q:'Sebutkan tiga langkah dasar untuk mengamankan server dari akses tidak sah.',a:'Gunakan pembaruan keamanan, firewall dengan aturan terbatas, serta akun unik dengan hak akses minimum.',p:'Informasi ini langsung terlihat pada gambar (label 1-3) dan cerita (port 21 di firewall). Jawaban cukup menyebut ulang informasi.'},
{q:'Mengapa waktu pengumpulan tugas turun dari pekan 1 ke pekan 5? Hubungkan skenario dengan prinsip keamanan server dan manajemen user.',a:'Contoh: file dikirim ke satu server pusat lewat LAN sehingga siswa tidak antre memakai flashdisk, akun dan folder pribadi mencegah file tertukar, dan siswa makin terbiasa memakai klien.',p:'Jawaban lain diterima jika memuat alasan dan bukti dari data (45 menit menjadi 8 menit) serta fungsi FTP (transfer terpusat, hak akses).'},
{q:'Hitunglah penghematan waktu pekan 5 dibanding pekan 1 (dalam menit dan persen). Berapa waktu rata-rata per siswa di pekan 5?',a:'Penghematan = 45 - 8 = 37 menit. Persen = 37 : 45 x 100% = sekitar 82%. Rata-rata per siswa pekan 5 = 8 : 32 = 0,25 menit (15 detik).',p:'Langkah: cari selisih, bagi dengan waktu awal, lalu kalikan 100%. Waktu per siswa = total waktu : jumlah siswa.'},
{q:'Kelas lain berisi 36 siswa dan waktu tersisa hanya 10 menit. Apakah server yang aman cukup? Putuskan berdasarkan data dan hitunganmu.',a:'Dengan 0,25 menit per siswa, 36 siswa butuh 36 x 0,25 = 9 menit, jadi cukup tetapi hanya tersisa 1 menit; akun dan folder sebaiknya disiapkan lebih dulu. Dengan cara flashdisk pekan 1 (45 : 32 = sekitar 1,41 menit per siswa), 36 siswa butuh sekitar 51 menit sehingga tidak cukup.',p:'Keputusan boleh berbeda (misalnya tetap menyiapkan cadangan) selama memakai angka 9 menit dan batas 10 menit sebagai bukti.'}];
const STORY='Di SMK Nusa Cendekia (nama fiktif), Pak Rudi mengajar Administrasi Infrastruktur Jaringan di kelas XI yang berisi 32 siswa. Setiap selesai praktik, siswa mengumpulkan laporan dan file konfigurasi. Awalnya mereka bergantian memakai flashdisk, sehingga pengumpulan memakan 45 menit dan beberapa file rusak. Pak Rudi lalu meminta siswa memasang FileZilla Server di komputer lab. Siswa membuat akun, menentukan folder tujuan, dan mengatur hak akses agar setiap siswa hanya bisa mengunggah ke folder miliknya. Beberapa siswa sempat gagal terhubung karena lupa membuka port 21 di firewall; mereka mencari penyebabnya sendiri, saling bertanya, dan mencatat langkah perbaikannya. Dalam lima pekan, mereka terbiasa memakai klien dan pengumpulan hanya butuh 8 menit. Selain lebih cepat, guru dapat memeriksa semua file di satu tempat dan tidak ada tugas yang hilang.';
function pjg(n){pj=n;render();scrollTo(0,0)}
function pjb(i){if(!(pa[i]||'').trim()){pb[i]=-1}else pb[i]=1;render()}
function pojok(){const T=['Amati','Baca','Pahami Data','Jawab','Refleksi'];let b='';
 if(pj===0)b=`<div class="card"><h3 style="margin-top:0">1. Amati Gambarnya</h3>

 <style>.b{fill:var(--soft);stroke:var(--pri);stroke-width:2}.t{fill:var(--tx);font:600 14px system-ui}.s{fill:var(--mut);font:12px system-ui}.n{fill:var(--pri)}.nt{fill:#fff;font:700 13px system-ui}</style>
 <rect class="b" x="15" y="85" width="150" height="80" rx="10"/><text class="t" x="90" y="120" text-anchor="middle">Komputer Siswa</text><text class="s" x="90" y="140" text-anchor="middle">(klien)</text>
 <rect class="b" x="245" y="100" width="150" height="50" rx="10"/><text class="t" x="320" y="130" text-anchor="middle">Jaringan LAN</text>

 <text class="s" x="547" y="85" text-anchor="middle">Folder: siswa01</text><text class="s" x="547" y="105" text-anchor="middle">Folder: siswa02</text><text class="s" x="547" y="125" text-anchor="middle">Folder: ...</text><text class="s" x="547" y="145" text-anchor="middle">Folder: siswa32</text><text class="s" x="547" y="195" text-anchor="middle">Login + hak akses</text>
 <line x1="165" y1="125" x2="243" y2="125" stroke-width="3" style="stroke:var(--pri)" marker-end="url(#ar)"/><line x1="395" y1="125" x2="468" y2="125" stroke-width="3" style="stroke:var(--pri)" marker-end="url(#ar)"/>
 <text class="s" x="430" y="112" text-anchor="middle">Port 21</text>
 <circle class="n" cx="90" cy="70" r="13"/><text class="nt" x="90" y="75" text-anchor="middle">1</text><circle class="n" cx="320" cy="85" r="13"/><text class="nt" x="320" y="90" text-anchor="middle">2</text><circle class="n" cx="547" cy="14" r="13"/><text class="nt" x="547" y="19" text-anchor="middle">3</text></svg>
 <p><b>Gambar 1.</b> Alur pengumpulan tugas lewat FTP di lab jaringan. Penanda: 1 = perangkat siswa, 2 = jalur jaringan, 3 = server penyimpan file.</p>
 <p class="mut">Ilustrasi diagram, bukan foto kejadian sebenarnya.</p>
 <div class="card" style="background:var(--soft);border:0"><b>Pertanyaan pengamatan</b><ol><li>Apa yang kamu lihat pada gambar?</li><li>Bagaimana hubungan gambar ini dengan materi yang kita pelajari?</li></ol></div></div>`;
 if(pj===1)b=`<div class="card"><h3 style="margin-top:0">2. Baca Kisahnya: Dari Flashdisk ke server yang aman</h3><div class="rd">${esc(STORY)}</div><p class="mut">Kisah ini adalah skenario fiktif untuk pembelajaran (tokoh, sekolah, dan angka tidak nyata).</p></div>
 <div class="card" style="background:var(--soft);border:0"><b>Hubungannya dengan Pelajaran Kita</b><ul><li><b>server yang aman</b> menyimpan file di satu tempat sehingga mudah diperiksa.</li><li><b>klien</b> (misalnya FileZilla Client) terhubung dengan host, username, password, dan port 21.</li><li><b>Konfigurasi user dan hak akses</b> menjaga setiap siswa hanya mengunggah ke foldernya.</li><li><b>Firewall</b> perlu mengizinkan port FTP agar koneksi berhasil.</li></ul></div>
 <div class="card mut">Sumber konsep: <a href="https://www.rfc-editor.org/rfc/rfc959" target="_blank" rel="noopener">RFC 959 – File Transfer Protocol (IETF)</a>; <a href="https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml" target="_blank" rel="noopener">IANA – Service Name and Transport Protocol Port Number Registry</a>.</div>`;
 if(pj===2)b=`<div class="card"><h3 style="margin-top:0">3. Pahami Datanya</h3><b>Waktu mengumpulkan 32 tugas per pekan (menit)</b>
 <div class="sc"><table><tr><th>Pekan</th><th>Metode</th><th>Waktu (menit)</th></tr>${PD.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><b>${r[2]}</b></td></tr>`).join('')}</table></div>

 ${PD.map(r=>`<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><span style="width:60px;font-size:13px">${r[0]}</span><div class="bar" style="flex:1;height:20px"><i style="width:${r[2]/50*100}%;background:${r[2]>20?'#64748b':'var(--pri)'}"></i></div><b style="width:70px;font-size:13px">${r[2]} mnt</b></div>`).join('')}
 <p class="mut">Data simulasi untuk pembelajaran. Batang abu-abu = cara lama (di atas 20 menit), batang biru = FTP; label tetap tertulis pada setiap baris.</p></div>`;
 if(pj===3)b=`<div class="card"><h3 style="margin-top:0">4. Ayo Temukan Makna</h3><p class="mut">Tulis jawabanmu dulu (atau di buku/diskusi), baru buka pembahasan.</p></div>`+PQ.map((x,i)=>`<div class="card"><b>${['Temukan informasi','Simpulkan hubungan','Hitung dan bandingkan','Ambil keputusan'][i]}</b><p>${i+1}. ${esc(x.q)}</p><textarea rows="3" placeholder="Tulis jawabanmu..." oninput="pa[${i}]=this.value">${esc(pa[i]||'')}</textarea>
 <button class="btn s" onclick="pjb(${i})">Lihat Pembahasan</button>${pb[i]===-1?'<p class="mut">Coba jawab dulu ya, lalu buka pembahasan.</p>':''}${pb[i]===1?`<div class="card" style="background:var(--soft);border:0;margin-top:10px"><b>Contoh jawaban:</b> ${esc(x.a)}<br><br><b>Pembahasan:</b> ${esc(x.p)}</div>`:''}</div>`).join('');
 if(pj===4)b=`<div class="card"><h3 style="margin-top:0">5. Inspirasi untukku</h3><p><b>Setelah membaca, mengamati, dan memahami data, keterampilan apa yang ingin kamu kuasai?</b></p><textarea rows="3" placeholder="Tulis refleksimu..."></textarea>
 <div class="card" style="background:var(--soft);border:0"><b>Tantangan kecil</b><p>Rancang struktur folder FTP untuk satu kelas: tentukan nama folder, siapa yang boleh membaca, menulis, dan menghapus. Jelaskan alasannya, lalu diskusikan dengan temanmu.</p></div></div>`;
 return `<div class="pojok-hero"><span class="pojok-chip">✦ RUANG EKSPLORASI DIGITAL</span><h1>POJOK DIGITAL</h1><p>Lihat Dunianya, Baca Kisahnya, Pahami Datanya! Jelajahi skenario nyata, amati data, pecahkan tantangan, dan bangun kebiasaan digital yang aman.</p><span class="pojok-chip">01 · Amati</span><span class="pojok-chip">02 · Pahami</span><span class="pojok-chip">03 · Praktikkan</span></div>
 <div class="row" style="margin-bottom:12px;justify-content:flex-start">${T.map((t,i)=>`<span class="tag ${i===pj?'ok':''}" style="${i===pj?'font-weight:700':''}">${i+1}. ${t}</span>`).join('')}</div>${b}

function dmurid(){if(me.role!=='guru')return '';const us=G('users').filter(u=>u.role==='murid'),h=G('hasil'),pr=G('progress'),n=G('materi').length;
 return `<h2>Data Murid (${us.length} siswa)</h2><p class="mut">Akun siswa menggunakan <b>username nama depan</b> dan <b>password sesuai nomor absen (01–36)</b>. Tombol Reset PW mengembalikan password ke nomor absen siswa.</p><div class="card"><b>Tambah Murid</b><div class="grid" style="margin:8px 0 0"><div><input id="mn" placeholder="Nama lengkap"></div><div><input id="mu" placeholder="Username"></div><div><input id="mp" placeholder="Password" value="123"></div></div><button class="btn" onclick="addM()">+ Tambah</button> <button class="btn o" onclick="expM()">⬇ Ekspor Excel</button><p id="mm" class="mut"></p></div>
 <div class="card sc"><table><tr><th>No</th><th>Nama</th><th>Username</th><th>Password / Absen</th><th>Materi</th><th>Pengerjaan</th><th>Nilai Terakhir</th><th></th></tr>${us.map((u,i)=>{const hh=h.filter(x=>x.user_id===u.id);return `<tr><td>${i+1}</td><td>${esc(u.nama)}</td><td>${esc(u.username)}</td><td>${esc(u.password)}</td><td>${pr.filter(p=>p.user_id===u.id).length}/${n}</td><td>${hh.length}</td><td><b>${hh.length?hh[hh.length-1].nilai:'-'}</b></td><td><button class="btn o s" onclick="rpw(${u.id})">Reset PW</button> <button class="btn r s" onclick="delM(${u.id})">Hapus</button></td></tr>`}).join('')||'<tr><td>Belum ada murid</td></tr>'}</table></div>`}
function addM(){const n=$('mn').value.trim(),u=($('mu').value.trim()||firstUsername(n)),p=$('mp').value||absenPassword(n,G('users').filter(x=>x.role==='murid').length+1),us=G('users');
 if(!n||!u){$('mm').textContent='Nama dan username wajib diisi';return}
 if(us.some(x=>x.username===u)){$('mm').textContent='Username sudah dipakai';return}
 us.push({id:us.reduce((a,b)=>Math.max(a,b.id),0)+1,nama:n,role:'murid',username:u,password:p});S('users',us);render()}
function delM(id){S('users',G('users').filter(u=>u.id!==id));S('hasil',G('hasil').filter(x=>x.user_id!==id));S('progress',G('progress').filter(x=>x.user_id!==id));render()}
function rpw(id){const us=G('users');const u=us.find(u=>u.id===id);if(!u)return;u.password=absenPassword(u.nama,us.filter(x=>x.role==='murid').findIndex(x=>x.id===id)+1);S('users',us);alert('Password direset ke nomor absen: '+u.password)}
function expM(){const h=G('hasil'),pr=G('progress'),rows=G('users').filter(u=>u.role==='murid').map(u=>{const hh=h.filter(x=>x.user_id===u.id);return{Nama:u.nama,Username:u.username,'Materi Selesai':pr.filter(p=>p.user_id===u.id).length,Pengerjaan:hh.length,'Nilai Terakhir':hh.length?hh[hh.length-1].nilai:''}});
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Murid');XLSX.writeFile(wb,'data-murid.xlsx')}
function db(){const T={users:'id, nama, role, username, password',materi:'id, judul, deskripsi, isi',soal:'id, pertanyaan, a, b, c, d, kunci, sumber',hasil:'id, user_id, nilai, benar, total, tanggal',progress:'user_id, materi_id'};
 return `<h2>Database (Tabel)</h2>`+Object.keys(T).map(t=>`<div class="card"><div class="row"><b>${t}</b><span class="tag">${G(t).length} baris</span></div><p class="mut">${T[t]}</p></div>`).join('')}
